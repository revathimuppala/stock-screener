[tool.poetry]
name = "screener"
version = "0.1.0"
description = "FinTech stock screener backend"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
yfinance = "^0.2"
pandas = "^2.2"
pydantic = "^2.9"
tenacity = "^9.0"
pybreaker = "^1.2"
cachetools = "^5.5"
sqlalchemy = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-bdd = "^7.3"
pytest-cov = "^5.0"
httpx = "^0.27"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
bdd_features_base_dir = "features"
addopts = "--cov=src --cov-report=term-missing"
